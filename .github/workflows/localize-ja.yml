name: Localize JP 4.0 item names

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/localize-ja.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Japanese Ver.4.0 names
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          names_path = Path("data/item-names.json")
          data = json.loads(names_path.read_text(encoding="utf-8"))

