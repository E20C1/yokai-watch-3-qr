name: Compare community YW3 catalog

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/community-sync.yml"
      - "tools/compare_community_catalog.py"
      - "data/qr2-jp40.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare upstream catalog with JP4.0 QR2 table
        run: python tools/compare_community_catalog.py
      - name: Validate local QR2 dataset
        run: python tools/validate_dataset.py
      - name: Commit generated comparison
        run: |
          if git diff --quiet -- data/community-yu08083.json data/community-comparison.json docs/COMMUNITY_COMPARISON.md; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/community-yu08083.json data/community-comparison.json docs/COMMUNITY_COMPARISON.md
          git commit -m "data: compare Yu08083 verified YW3 catalog"
          git push
