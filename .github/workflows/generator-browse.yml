name: Enable generator browse

on:
  push:
    branches: ["main"]
    paths:
      - "tools/enable_generator_browse.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply browse patch
        run: python3 tools/enable_generator_browse.py

      - name: Validate JavaScript
        run: node --check src/app.js

      - name: Commit browse update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: browse all QR effects with incremental scrolling"
          git push
