name: Apply Japanese item names

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/localize-ja2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply localization
        run: python3 tools/localize_ja.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          data = json.load(open('data/item-names.json', encoding='utf-8'))
          assert len(data) == 140, len(data)
          assert data['0xC6458704']['name'] == '禁断の果実'
          assert data['0xC6458704']['name_en'] == 'Forbidden Fruit'
          assert data['0xD24D4C6D']['name'] == '古びたコイン'
          assert data['0x6E589520']['name'] == '議長の錫杖'
          assert data['0xDACDFBF5']['name'] == 'ぬらり神の手形'
          assert all('name_en' in x and 'category_en' in x for x in data.values())
          print('Japanese item-name assertions: PASS')
          PY
          node --check src/app.js
          python3 tools/validate_dataset.py
          python3 tools/qr_v2.py Q1B --variation 0000 | grep -F 'Q1B00008CLTN07O0A2VJ3EU5L3LETAB3G'
      - name: Commit localization
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/localize-ja.yml .github/workflows/localize-ja2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: use Japanese Ver.4.0 item names"
          git push
